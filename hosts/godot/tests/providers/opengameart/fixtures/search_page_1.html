<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Search | OpenGameArt.org</title>
</head>
<body class="html not-front not-logged-in page-art-search">
  <div id="page">
    <div id="main-wrapper">
      <div id="content" class="column">
        <div class="section">
          <h1 class="title" id="page-title">Art Search</h1>
          <div class="view view-art-search view-id-art_search view-display-id-page">
            <div class="view-content">
              <div class="views-row views-row-1 views-row-odd views-row-first views-row-last">
                <div class="views-field views-field-title">
                  <span class="field-content"><a href="/content/forest-concept-art">Forest Concept Art</a></span>
                </div>
                <div class="views-field views-field-field-art-preview">
                  <div class="field-content">
                    <a href="/content/forest-concept-art"><img src="https://opengameart.org/sites/default/files/styles/thumbnail/public/forest_preview.png" width="100" height="100" alt="Preview" /></a>
                  </div>
                </div>
                <div class="views-field views-field-field-art-type">
                  <span class="views-label">Art Type: </span>
                  <span class="field-content">Concept Art</span>
                </div>
                <div class="views-field views-field-field-art-licenses">
                  <span class="views-label">License(s): </span>
                  <div class="field-content">
                    <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a>
                  </div>
                </div>
                <div class="views-field views-field-name">
                  <span class="views-label">Author: </span>
                  <span class="field-content"><a href="/users/sketcher" title="View user profile.">Sketcher</a></span>
                </div>
              </div>
            </div>
            <div class="item-list">
              <ul class="pager">
                <li class="pager-first first"><a title="Go to first page" href="/art-search?keys=test&amp;page=0">« first</a></li>
                <li class="pager-previous"><a title="Go to previous page" href="/art-search?keys=test&amp;page=0">‹ previous</a></li>
                <li class="pager-item"><a title="Go to page 1" href="/art-search?keys=test&amp;page=0">1</a></li>
                <li class="pager-current last">2</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
