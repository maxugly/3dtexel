name: Godot addon checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl --fail --location --output godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          rm godot.zip
      - name: Offline tests
        run: |
          timeout 90s godot --headless --path . -s tests/test_core.gd
          timeout 30s godot --headless --path . -s tests/test_layout.gd
          timeout 30s godot --headless --path . -s tests/test_tiles.gd
          timeout 90s godot --headless --path . -s tests/test_pagination.gd
          timeout 30s godot --headless --path . -s tests/test_thumbnails.gd
          timeout 45s godot --headless --path . -s tests/test_cache.gd
          timeout 45s godot --headless --path . -s tests/test_credits.gd
          timeout 45s godot --headless --path . -s tests/test_download_choices.gd
          timeout 45s godot --headless --path . -s tests/test_providers.gd
          timeout 45s godot --headless --path . -s tests/test_download_inventory.gd
          timeout 45s godot --headless --path . -s tests/test_search_session.gd
          timeout 45s godot --headless --path . -s tests/test_batch_cards.gd
          timeout 45s godot --headless --path . -s tests/providers/opengameart/test_opengameart.gd
